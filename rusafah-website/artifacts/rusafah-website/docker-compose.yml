# Local development services for the RUSAFAH public website.
# Ports are offset so they do not collide with the platform's compose stack
# (which owns 5432, 1025 and 8025 on this machine).
name: rusafah-website

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rusafah
      POSTGRES_PASSWORD: rusafah
      POSTGRES_DB: rusafah_web
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rusafah -d rusafah_web"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    # SMTP sink with a web inbox. Lead notifications land here in development.
    image: axllent/mailpit:v1.24
    ports:
      - "1026:1025" # SMTP
      - "8026:8025" # Web UI  http://localhost:8026
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

volumes:
  pgdata:
